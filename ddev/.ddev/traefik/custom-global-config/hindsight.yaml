http:
  routers:
    hindsight-devtest-http:
      entrypoints:
        - http-80
      rule: Host(`hindsight.dev.test`)
      service: hindsight-devtest
      middlewares:
        - hindsight-devtest-https
    hindsight-devtest-https:
      entrypoints:
        - http-443
      rule: Host(`hindsight.dev.test`)
      service: hindsight-devtest
      tls: true
  middlewares:
    hindsight-devtest-https:
      redirectScheme:
        scheme: https
        permanent: true
  services:
    hindsight-devtest:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://hindsight:9999
