services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.10.0
    container_name: hindsight
    restart: unless-stopped
    env_file:
      - credentials.env
    environment:
      HINDSIGHT_API_WORKER_ID: hindsight
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_BASE_URL: http://10.121.16.20:20128/v1
      HINDSIGHT_API_LLM_MODEL: memory-extract
      HINDSIGHT_API_LLM_REASONING_EFFORT: low
      HINDSIGHT_API_LLM_TIMEOUT: 300
      HINDSIGHT_API_LLM_DEFAULT_HEADERS: '{"X-9Router-Token-Saver":"off"}'
      HINDSIGHT_API_LLM_OUTPUT_LANGUAGE: English
      HINDSIGHT_API_REFLECT_LLM_PROVIDER: openai
      HINDSIGHT_API_REFLECT_LLM_BASE_URL: http://10.121.16.20:20128/v1
      HINDSIGHT_API_REFLECT_LLM_MODEL: memory-reflect
      HINDSIGHT_API_REFLECT_LLM_TIMEOUT: 300
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: local
      HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL: BAAI/bge-small-en-v1.5
      HINDSIGHT_API_RERANKER_PROVIDER: local
      HINDSIGHT_API_RERANKER_LOCAL_MODEL: cross-encoder/ms-marco-MiniLM-L-6-v2
      HINDSIGHT_API_DEFAULT_BANK_TEMPLATE: '{"version":"1","bank":{"memory_defense":{"enabled":true,"rules":[{"on":"sensitive_data","action":"redact"}]}}}'
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:9999:9999"
      - "10.121.16.20:9999:9999"
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    networks:
      - default
      - ddev_default
    cpus: 4
    mem_limit: 6g

networks:
  ddev_default:
    external: true

volumes:
  hindsight-data:
