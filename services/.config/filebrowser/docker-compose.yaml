name: filebrowser-quantum

services:
  filebrowser:
    image: gtstef/filebrowser:1.5.6-stable
    container_name: filebrowser-quantum
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    entrypoint:
      - /bin/sh
      - -ec
      - export FILEBROWSER_ADMIN_PASSWORD="$(cat /run/secrets/admin-password)"; exec /home/filebrowser/filebrowser
    volumes:
      - /home/jacocanete:/srv:rw
      - filebrowser-quantum-state:/home/filebrowser/data:rw
      - /home/jacocanete/.config/filebrowser/admin-password:/run/secrets/admin-password:ro
    networks:
      - ddev_default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

networks:
  ddev_default:
    external: true

volumes:
  filebrowser-quantum-state:
    external: true
